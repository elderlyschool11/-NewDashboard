<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elderly Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --text-main: #1e293b;
            --text-sub: #64748b;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header & Stats */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            animation: fadeIn 0.5s ease;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .stat-icon {
            width: 45px; height: 45px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }

        /* Search Bar */
        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 15px 15px 15px 50px;
            border-radius: 15px;
            border: 1px solid #e2e8f0;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(37,99,235,0.1); }
        .search-box i { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: var(--text-sub); }

        /* List Styling */
        .elder-card {
            background: white;
            padding: 15px 20px;
            border-radius: 18px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
            animation: slideUp 0.4s ease forwards;
        }

        .elder-card:hover { transform: translateY(-3px); border-color: var(--primary); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }

        .elder-info { display: flex; align-items: center; gap: 15px; }
        .elder-avatar {
            width: 45px; height: 45px;
            background: #eff6ff; color: var(--primary);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: 600;
        }

        /* Modal */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
            z-index: 100; justify-content: center; align-items: center;
        }

        .modal-content {
            background: white; width: 90%; max-width: 500px;
            padding: 30px; border-radius: 25px; position: relative;
            animation: zoomIn 0.3s ease;
        }

        .form-input {
            width: 100%; padding: 12px; margin: 8px 0 15px;
            border: 1.5px solid #e2e8f0; border-radius: 12px; font-size: 15px;
        }

        .btn-save {
            width: 100%; padding: 15px; background: var(--primary);
            color: white; border: none; border-radius: 15px;
            font-weight: 600; cursor: pointer; font-size: 16px;
        }

        @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }
        @keyframes slideUp { from {opacity: 0; transform: translateY(10px);} to {opacity: 1; transform: translateY(0);} }
        @keyframes zoomIn { from {opacity: 0; transform: scale(0.9);} to {opacity: 1; transform: scale(1);} }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h1 style="margin:0; font-size: 22px; color: var(--text-main);">Dashboard ผู้สูงอายุ</h1>
            <p style="margin:5px 0 0; color: var(--text-sub); font-size: 14px;">จัดการข้อมูลและติดตามผล</p>
        </div>
        <i class="fas fa-sync-alt" style="cursor:pointer; color: var(--primary);" onclick="loadData()"></i>
    </div>

    <div class="stat-grid">
        <div class="stat-card">
            <div class="stat-icon" style="background: #eff6ff; color: #2563eb;"><i class="fas fa-users"></i></div>
            <div>
                <div style="font-size: 12px; color: var(--text-sub);">ทั้งหมด</div>
                <div style="font-size: 20px; font-weight: 600;" id="stat-total">0</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon" style="background: #fef2f2; color: #dc2626;"><i class="fas fa-notes-medical"></i></div>
            <div>
                <div style="font-size: 12px; color: var(--text-sub);">กลุ่มเสี่ยง</div>
                <div style="font-size: 20px; font-weight: 600;" id="stat-risk">0</div>
            </div>
        </div>
    </div>

    <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="search" placeholder="ค้นหาชื่อหรือนามสกุล..." onkeyup="filterData()">
    </div>

    <div id="list">
        <div style="text-align:center; padding:50px; color:var(--text-sub);"><i class="fas fa-spinner fa-spin"></i> กำลังโหลดข้อมูล...</div>
    </div>
</div>

<!-- Edit Modal -->
<div class="modal" id="editModal">
    <div class="modal-content">
        <h3 style="margin: 0 0 20px; color: var(--primary);">แก้ไขข้อมูลผู้สูงอายุ</h3>
        <input type="hidden" id="edit-lineId">
        
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <div><label style="font-size:12px;">ชื่อ</label><input type="text" id="edit-fname" class="form-input"></div>
            <div><label style="font-size:12px;">นามสกุล</label><input type="text" id="edit-lname" class="form-input"></div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <div><label style="font-size:12px;">อายุ</label><input type="number" id="edit-age" class="form-input"></div>
            <div><label style="font-size:12px;">เพศ</label>
                <select id="edit-gender" class="form-input">
                    <option value="ชาย">ชาย</option><option value="หญิง">หญิง</option>
                </select>
            </div>
        </div>

        <label style="font-size:12px;">โรคประจำตัว</label>
        <input type="text" id="edit-disease" class="form-input">

        <div style="display:flex; gap:10px;">
            <button class="btn-save" style="background:#64748b;" onclick="closeModal()">ยกเลิก</button>
            <button class="btn-save" onclick="updateData()">บันทึกข้อมูล</button>
        </div>
    </div>
</div>

<script>
    const WEB_APP_URL = "ก๊อปปี้ URL ของ Web App มาวางที่นี่"; 
    let masterData = [];

    async function loadData() {
        const res = await fetch(WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'fetch' })
        });
        masterData = await res.json();
        render(masterData);
    }

    function render(data) {
        const listDiv = document.getElementById('list');
        listDiv.innerHTML = '';
        
        data.forEach(item => {
            const div = document.createElement('div');
            div.className = 'elder-card';
            div.onclick = () => openEdit(item);
            div.innerHTML = `
                <div class="elder-info">
                    <div class="elder-avatar">${item.firstName.charAt(0)}</div>
                    <div>
                        <div style="font-weight:600;">${item.firstName} ${item.lastName}</div>
                        <div style="font-size:12px; color:var(--text-sub);">อายุ ${item.age} ปี | ${item.chronicDiseases}</div>
                    </div>
                </div>
                <i class="fas fa-chevron-right" style="color:#e2e8f0;"></i>
            `;
            listDiv.appendChild(div);
        });

        document.getElementById('stat-total').innerText = data.length;
        document.getElementById('stat-risk').innerText = data.filter(d => d.chronicDiseases !== '-').length;
    }

    function filterData() {
        const text = document.getElementById('search').value.toLowerCase();
        const filtered = masterData.filter(d => 
            d.firstName.toLowerCase().includes(text) || 
            d.lastName.toLowerCase().includes(text)
        );
        render(filtered);
    }

    function openEdit(item) {
        document.getElementById('edit-lineId').value = item.lineId;
        document.getElementById('edit-fname').value = item.firstName;
        document.getElementById('edit-lname').value = item.lastName;
        document.getElementById('edit-age').value = item.age;
        document.getElementById('edit-gender').value = item.gender;
        document.getElementById('edit-disease').value = item.chronicDiseases;
        document.getElementById('editModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('editModal').style.display = 'none'; }

    async function updateData() {
        Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        
        const payload = {
            action: 'update',
            lineId: document.getElementById('edit-lineId').value,
            firstName: document.getElementById('edit-fname').value,
            lastName: document.getElementById('edit-lname').value,
            age: document.getElementById('edit-age').value,
            gender: document.getElementById('edit-gender').value,
            weight: 0, // ค่าเดิมไม่ได้โชว์ใน edit แต่ส่งกลับไปได้
            height: 0,
            chronicDiseases: document.getElementById('edit-disease').value
        };

        await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) });
        Swal.fire('สำเร็จ', 'อัปเดตข้อมูลเรียบร้อย', 'success');
        closeModal();
        loadData();
    }

    loadData();
</script>
</body>
</html>
